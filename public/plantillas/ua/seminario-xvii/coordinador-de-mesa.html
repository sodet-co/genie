<!doctype html>
<!--
  Certificado de coordinador de mesa · XVII Seminario Internacional Investigación Urbano Regional.
  Fondo: el PNG con el mismo nombre en esta carpeta.
  Nombre y título se reducen solos si no caben en su caja (data-ajustar).
  Marcadores: {{nombre}} y {{titulo}}.
-->
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,600&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        width: 1056px;
        height: 816px;
      }

      body {
        position: relative;
        overflow: hidden;
        background: #f4efe3 url("coordinador-de-mesa.png") center / 100% 100% no-repeat;
        font-family: "Source Serif 4", Georgia, serif;
        color: #3a3a3a;
      }

      .nombre,
      .titulo {
        position: absolute;
        display: flex;
        /* Pegado a la línea de abajo (crece hacia arriba si ocupa 2 líneas). */
        align-items: flex-end;
        justify-content: center;
        text-align: center;
      }

      .nombre {
        padding-bottom: 5px;
        box-sizing: border-box;
        left: 282px;
        width: 492px;
        top: 166px;
        height: 78px;
      }

      .nombre p {
        margin: 0;
        font-size: 32px;
        line-height: 1.12;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.01em;
      }

      .titulo {
        padding-bottom: 3px;
        box-sizing: border-box;
        left: 208px;
        width: 640px;
      }

      .titulo p {
        margin: 0;
        font-size: 17.5px;
        line-height: 1.2;
        font-weight: 600;
        font-style: italic;
      }
      /* Textos fijos (ver el final del documento): centrados en la página. */
      .fijo {
        position: absolute;
        left: 0;
        width: 1056px;
        margin: 0;
        text-align: center;
        white-space: nowrap;
        line-height: 1;
        color: #51504f;
        font-variation-settings: "opsz" 20;
      }

      .frase {
        font-size: 15.4px;
        font-weight: 700;
      }

      .fecha {
        font-size: 15.53px;
        font-weight: 700;
      }

      .firmante {
        font-size: 14.15px;
        font-weight: 700;
        letter-spacing: 0.01em;
      }

      .cargo {
        font-size: 13.75px;
        font-weight: 400;
        letter-spacing: 0.02em;
      }
    </style>
  </head>
  <body>
    <div class="nombre" data-ajustar data-ajustar-min="20" style="top: 166px; height: 78px">
      <p>{{nombre}}</p>
    </div>
    <div class="titulo" data-ajustar data-ajustar-min="11" style="top: 392px; height: 39px">
      <p>{{titulo}}</p>
    </div>
    <!--
      Textos fijos del certificado. Se pueden corregir aquí (por ejemplo el
      nombre o el cargo de quien firma). Cada línea va centrada; "top" es su
      altura en la página (816 px de alto).
    -->
    <p class="fijo frase" style="top: 373.5px">Como coordinador de la mesa temática titulada:</p>
    <p class="fijo fecha" style="top: 438.5px">Dado en Barranquilla-Atlántico a los 12 días del mes de noviembre de 2026</p>
    <p class="fijo firmante" style="top: 564.7px">LEONARDO ROMERO OLVIERA</p>
    <p class="fijo cargo" style="top: 592.2px">PRESIDENTE DE LA ACIUR</p>
  </body>
</html>
