<!doctype html>
<!--
  Certificado de ponente · XVII Seminario Internacional Investigación Urbano Regional.
  Fondo: el PNG con el mismo nombre en esta carpeta.
  Nombre y título se reducen solos si no caben en su caja (data-ajustar).
  Marcadores: {{nombre}} y {{titulo}}.
-->
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,600;0,8..60,700;1,8..60,600&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        width: 1056px;
        height: 816px;
      }

      body {
        position: relative;
        overflow: hidden;
        background: #f4efe3 url("ponente.png") center / 100% 100% no-repeat;
        font-family: "Source Serif 4", Georgia, serif;
        color: #3a3a3a;
      }

      .nombre,
      .titulo {
        position: absolute;
        display: flex;
        /* Pegado a la línea de abajo (crece hacia arriba si ocupa 2 líneas). */
        align-items: flex-end;
        justify-content: center;
        text-align: center;
      }

      .nombre {
        padding-bottom: 5px;
        box-sizing: border-box;
        left: 282px;
        width: 492px;
        top: 166px;
        height: 78px;
      }

      .nombre p {
        margin: 0;
        font-size: 32px;
        line-height: 1.12;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.01em;
      }

      .titulo {
        padding-bottom: 3px;
        box-sizing: border-box;
        left: 208px;
        width: 640px;
      }

      .titulo p {
        margin: 0;
        font-size: 17.5px;
        line-height: 1.2;
        font-weight: 600;
        font-style: italic;
      }
    </style>
  </head>
  <body>
    <div class="nombre" data-ajustar data-ajustar-min="20" style="top: 166px; height: 78px">
      <p>{{nombre}}</p>
    </div>
    <div class="titulo" data-ajustar data-ajustar-min="11" style="top: 402px; height: 30px">
      <p>{{titulo}}</p>
    </div>
  </body>
</html>
